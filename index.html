<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bd-hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐿️</text></svg>">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bd-color-bg-base);
        color: var(--bd-color-text-primary);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      /* Card view transitions: tilt up-right on exit, settle in on enter */
      @keyframes card-exit {
        to {
          opacity: 0;
          transform: rotate(8deg) translate(100px, -18px);
        }
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: rotate(-5deg) translate(-60px, 14px);
        }
      }

      ::view-transition-old(*) {
        animation: 260ms cubic-bezier(0.4, 0, 1, 1) both card-exit;
        transform-origin: bottom left;
      }
      ::view-transition-new(*) {
        animation: 340ms cubic-bezier(0, 0, 0.2, 1) both card-enter;
        transform-origin: bottom left;
      }

      /* Keep the root transition as a simple fast fade */
      ::view-transition-old(root) {
        animation: 150ms ease both fade-out;
        transform-origin: center;
      }
      ::view-transition-new(root) {
        animation: 150ms ease both fade-in;
        transform-origin: center;
      }
      @keyframes fade-out { to   { opacity: 0; } }
      @keyframes fade-in  { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
